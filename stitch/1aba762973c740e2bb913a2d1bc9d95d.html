<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Empty State - Regional Incident Command</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#233144",
                        "surface-container-low": "#191b23",
                        "on-secondary-fixed-variant": "#3a485b",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffb596",
                        "surface": "#11131b",
                        "surface-container-lowest": "#0c0e16",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-tertiary": "#581e00",
                        "secondary-container": "#3c4a5e",
                        "secondary": "#b9c7df",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-primary-container": "#eeefff",
                        "surface-variant": "#32343d",
                        "surface-tint": "#b4c5ff",
                        "inverse-on-surface": "#2e3039",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-dim": "#11131b",
                        "surface-container-high": "#282a32",
                        "tertiary-container": "#bc4800",
                        "on-surface": "#e1e2ed",
                        "error": "#ffb4ab",
                        "on-primary": "#002a78",
                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed": "#360f00",
                        "primary-fixed-dim": "#b4c5ff",
                        "background": "#11131b",
                        "on-surface-variant": "#c3c6d7",
                        "on-error": "#690005",
                        "on-tertiary-container": "#ffede6",
                        "on-secondary-container": "#abb9d1",
                        "primary": "#b4c5ff",
                        "outline-variant": "#434655",
                        "primary-container": "#2563eb",
                        "surface-container": "#1d1f27",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "on-background": "#e1e2ed",
                        "error-container": "#93000a",
                        "surface-bright": "#373942",
                        "tertiary-fixed": "#ffdbcd",
                        "secondary-fixed": "#d5e3fc",
                        "on-secondary-fixed": "#0d1c2e",
                        "outline": "#8d90a0",
                        "surface-container-highest": "#32343d",
                        "inverse-surface": "#e1e2ed"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "unit": "8px",
                        "touch-target": "44px",
                        "gutter": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "mono-data": ["monospace"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-data": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }

</head>
<body class="bg-background text-on-surface font-body-md text-body-md h-screen w-screen overflow-hidden flex antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- SideNavBar -->
<aside class="fixed left-0 top-0 h-full w-64 bg-surface-container border-r border-outline-variant flex flex-col p-unit gap-base z-40 hidden md:flex">
<!-- Header Profile Area -->
<div class="flex items-center gap-3 px-3 py-4 mb-4 border-b border-outline-variant">
<div class="h-10 w-10 rounded-full bg-surface-container-highest border border-outline flex items-center justify-center overflow-hidden shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<div class="flex flex-col overflow-hidden">
<span class="font-headline-sm text-headline-sm font-bold text-primary truncate">HQ Alpha</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Sector 7 Command</span>
</div>
</div>
<!-- Navigation Links -->
<nav class="flex flex-col gap-1 w-full flex-1">
<!-- Active Tab (Dashboard) -->
<a class="flex items-center gap-3 px-3 h-touch-target bg-secondary-container text-on-secondary-container rounded-lg active:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<!-- Inactive Tab (Insights) -->
<a class="flex items-center gap-3 px-3 h-touch-target text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/50 transition-all rounded-lg active:opacity-80" href="#">
<span class="material-symbols-outlined">monitoring</span>
<span class="font-label-md text-label-md">Insights</span>
</a>
<!-- Inactive Tab (Settings) -->
<a class="flex items-center gap-3 px-3 h-touch-target text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/50 transition-all rounded-lg active:opacity-80 mt-auto" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
</aside>
<!-- Main Content Column -->
<div class="flex-1 flex flex-col h-full w-full md:ml-64 overflow-hidden relative">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-gutter h-touch-target z-50 shrink-0">
<!-- Brand Logo / Product Name -->
<div class="flex items-center gap-2">
<div class="md:hidden flex items-center justify-center h-8 w-8 rounded-DEFAULT hover:bg-surface-container-high transition-colors cursor-pointer mr-2">
<span class="material-symbols-outlined text-on-surface">menu</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Regional Incident Command</h1>
</div>
<!-- Right Actions (Search + Trailing Icons) -->
<div class="flex items-center gap-4">
<!-- Search Bar -->
<div class="relative hidden sm:block">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input class="bg-surface-container-low border border-outline-variant rounded-DEFAULT h-8 pl-9 pr-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors w-48 lg:w-64" placeholder="Search..." type="text"/>
</div>
<!-- Trailing Icons -->
<div class="flex items-center gap-1">
<button class="h-8 w-8 flex items-center justify-center rounded-DEFAULT text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="h-8 w-8 flex items-center justify-center rounded-DEFAULT text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 md:hidden">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Canvas Area (Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center p-container-padding bg-background overflow-y-auto relative z-0">
<!-- Subtle Grid Background Overlay for Technical Vibe -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(circle at center, #c3c6d7 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- Empty State Container (Glassmorphism inspired focal point) -->
<div class="relative flex flex-col items-center max-w-md text-center p-8 rounded-xl bg-surface-container-low/50 border border-outline-variant/30 backdrop-blur-sm shadow-2xl z-10">
<!-- Glowing Pedestal Graphic -->
<div class="relative w-24 h-24 mb-6 flex items-center justify-center">
<!-- Outer pulse ring -->
<div class="absolute inset-0 rounded-full border border-primary-container/20 opacity-50"></div>
<div class="absolute inset-2 rounded-full border border-primary-container/40 opacity-70"></div>
<!-- Inner solid circle -->
<div class="absolute inset-4 rounded-full bg-surface-container-highest border border-outline flex items-center justify-center shadow-[0_0_30px_rgba(37,99,235,0.15)]">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'wght' 300;">radar</span>
</div>
</div>
<!-- Messaging -->
<h2 class="font-display-lg text-display-lg text-on-surface mb-3 tracking-tight">No active incidents found.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 max-w-sm">
                    All monitored sectors are currently operating within nominal parameters. The situational awareness grid is clear.
                </p>
<!-- Call to Action -->
<button class="flex items-center justify-center gap-2 bg-primary-container text-on-primary-container font-label-md text-label-md px-6 py-3 min-w-[180px] h-touch-target rounded-DEFAULT hover:brightness-110 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-background group shadow-[0_4px_14px_0_rgba(37,99,235,0.2)]">
<span class="material-symbols-outlined text-[18px] group-hover:rotate-90 transition-transform duration-300">add</span>
                    Log First Incident
                </button>
</div>
</main>
</div>
</body></html>
