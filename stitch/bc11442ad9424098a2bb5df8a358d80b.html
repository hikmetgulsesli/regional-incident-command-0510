<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Incident Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#233144",
                        "surface-container-low": "#191b23",
                        "on-secondary-fixed-variant": "#3a485b",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffb596",
                        "surface": "#11131b",
                        "surface-container-lowest": "#0c0e16",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-tertiary": "#581e00",
                        "secondary-container": "#3c4a5e",
                        "secondary": "#b9c7df",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-primary-container": "#eeefff",
                        "surface-variant": "#32343d",
                        "surface-tint": "#b4c5ff",
                        "inverse-on-surface": "#2e3039",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-dim": "#11131b",
                        "surface-container-high": "#282a32",
                        "tertiary-container": "#bc4800",
                        "on-surface": "#e1e2ed",
                        "error": "#ffb4ab",
                        "on-primary": "#002a78",
                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed": "#360f00",
                        "primary-fixed-dim": "#b4c5ff",
                        "background": "#11131b",
                        "on-surface-variant": "#c3c6d7",
                        "on-error": "#690005",
                        "on-tertiary-container": "#ffede6",
                        "on-secondary-container": "#abb9d1",
                        "primary": "#b4c5ff",
                        "outline-variant": "#434655",
                        "primary-container": "#2563eb",
                        "surface-container": "#1d1f27",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "on-background": "#e1e2ed",
                        "error-container": "#93000a",
                        "surface-bright": "#373942",
                        "tertiary-fixed": "#ffdbcd",
                        "secondary-fixed": "#d5e3fc",
                        "on-secondary-fixed": "#0d1c2e",
                        "outline": "#8d90a0",
                        "surface-container-highest": "#32343d",
                        "inverse-surface": "#e1e2ed"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "unit": "8px",
                        "touch-target": "44px",
                        "gutter": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "mono-data": ["monospace"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["18px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "mono-data": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-container-padding selection:bg-primary selection:text-on-primary">
<!-- Task-focused layout: Suppressed Navigation Shell -->
<main class="w-full max-w-2xl bg-surface-container rounded-lg border border-outline-variant shadow-lg flex flex-col overflow-hidden">
<!-- Form Header -->
<header class="px-6 py-5 border-b border-outline-variant bg-surface-container-low flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">edit_document</span>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Edit Incident Record</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Update critical details for ongoing operational logs.</p>
</div>
</header>
<!-- Form Body -->
<form class="flex flex-col gap-6 p-6">
<!-- Field: Incident Title (Error State Demo) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-error flex items-center justify-between" for="incident_title">
<span>Incident Title <span class="text-error">*</span></span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-error text-on-surface rounded-DEFAULT px-3 py-2.5 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-error focus:border-error transition-colors" id="incident_title" placeholder="Enter formal incident designation" type="text" value=""/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-error text-[20px] pointer-events-none">error</span>
</div>
<div class="flex items-start gap-1 mt-0.5">
<span class="font-label-md text-label-md text-error">Incident Title is a required field.</span>
</div>
</div>
<!-- Field: Location -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="incident_location">
                    Location <span class="text-error">*</span>
</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant text-[20px] group-focus-within:text-primary transition-colors">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-DEFAULT pl-10 pr-3 py-2.5 font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="incident_location" placeholder="Enter precise location coordinates" type="text" value="Sector 7G, Industrial Quadrant"/>
</div>
</div>
<!-- Grid for shorter fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Field: Severity Level -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="incident_severity">Severity Level</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-DEFAULT px-3 py-2.5 font-body-md text-body-md appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="incident_severity">
<option value="critical">Critical (Level 1)</option>
<option selected="" value="high">High (Level 2)</option>
<option value="medium">Medium (Level 3)</option>
<option value="low">Low (Level 4)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant text-[20px] pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Field: Status (Bonus implicit field for CRUD context) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="incident_status">Operational Status</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-DEFAULT px-3 py-2.5 font-body-md text-body-md appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="incident_status">
<option selected="" value="active">Active / Ongoing</option>
<option value="contained">Contained</option>
<option value="resolved">Resolved</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant text-[20px] pointer-events-none">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Field: Personnel Assignment (Simulated Multi-select) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant">Personnel Assignment</label>
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-1.5 flex flex-wrap gap-1.5 items-center focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<!-- Assigned Personnel Pill 1 -->
<div class="flex items-center gap-1 bg-surface-variant text-on-surface pl-2 pr-1 py-1 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Cmdr. Shepard</span>
<button class="material-symbols-outlined text-[16px] text-on-surface-variant hover:text-error transition-colors rounded-full hover:bg-surface-container-highest p-0.5 ml-0.5" type="button">close</button>
</div>
<!-- Assigned Personnel Pill 2 -->
<div class="flex items-center gap-1 bg-surface-variant text-on-surface pl-2 pr-1 py-1 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Lt. Vansen</span>
<button class="material-symbols-outlined text-[16px] text-on-surface-variant hover:text-error transition-colors rounded-full hover:bg-surface-container-highest p-0.5 ml-0.5" type="button">close</button>
</div>
<!-- Input for adding more -->
<input class="flex-1 bg-transparent border-none text-on-surface font-body-md text-body-md focus:outline-none focus:ring-0 min-w-[150px] px-2 py-1 placeholder-on-surface-variant/50" placeholder="Search roster to assign..." type="text"/>
</div>
</div>
<!-- Field: Description -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="incident_description">Tactical Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-DEFAULT px-3 py-2.5 font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y" id="incident_description" placeholder="Provide detailed tactical situation report, initial response actions, and hazard assessment..." rows="4"></textarea>
</div>
</form>
<!-- Form Actions -->
<footer class="px-6 py-4 border-t border-outline-variant bg-surface-container-low flex items-center justify-end gap-3 mt-auto">
<button class="h-touch-target px-5 rounded-DEFAULT border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container-highest transition-colors active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-outline-variant focus:ring-offset-2 focus:ring-offset-background" type="button">
                Cancel
            </button>
<button class="h-touch-target px-6 rounded-DEFAULT bg-primary-container text-on-primary-container font-label-md text-label-md hover:brightness-110 transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background shadow-sm flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">save</span>
                Save Incident
            </button>
</footer>
</main>
</body></html>
